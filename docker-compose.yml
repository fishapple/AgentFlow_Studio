version: '3.8'

services:
  # PostgreSQL Database Service (Production)
  db:
    image: postgres:15-alpine
    container_name: agentflow-db
    environment:
      POSTGRES_DB: ${DB_NAME:-agentflow_db}
      POSTGRES_USER: ${DB_USER:-agentflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentflow_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agentflow_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentflow-network

  # Redis Cache Service (Production)
  redis:
    image: redis:7-alpine
    container_name: agentflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentflow-network

  # Backend API Service (FastAPI + Python)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: agentflow-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-agentflow_user}:${DB_PASSWORD:-agentflow_pass}@db:5432/${DB_NAME:-agentflow_db}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentflow-network

  # Frontend Service (Vite + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: agentflow-frontend
    depends_on:
      - backend
    networks:
      - agentflow-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  agentflow-network:
    driver: bridge
