version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agentflow-postgres
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: secret_password_change_me
      POSTGRES_DB: agentflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: agentflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agentflow-backend
    environment:
      DATABASE_URL: postgresql://agentflow:secret_password_change_me@postgres:5432/agentflow_db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Development Server (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: agentflow-frontend
    environment:
      VITE_API_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"  # Vite dev server port
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # API Gateway & Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: agentflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend

# Named volumes for persistent data
volumes:
  postgres_data:
  redis_data:
